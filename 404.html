<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found | AWS Cloud Architect Guide</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Self-contained: no second request. Tokens + navy header band copied from styles.css. -->
  <style>
    :root { --paper: #faf9f6; --paper-2: #f4f2ec; --ink: #1a1d21; --ink-2: #4a5159; --ink-3: #596169;
      --line-2: #d8d2c6; --navy: #15202b; --accent: #c2410c; --aws-orange: #ff9900; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
    .container { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: 1.5rem; }
    .strip { display: flex; align-items: center; height: 56px; background: var(--navy); }
    .cloud-icon { font-size: 1.5rem; line-height: 1; color: var(--aws-orange); }
    main { padding-block: 3rem 4rem; } .block { max-width: 36rem; }
    .error-code { margin: 0 0 .5rem; color: var(--ink-3); font-size: clamp(4rem, 17vw, 6rem); font-weight: 720; letter-spacing: -.05em; line-height: .95; }
    h1 { margin: 0 0 1rem; max-width: 26ch; font-size: clamp(1.6rem, 6.4vw, 2.125rem); font-weight: 720; letter-spacing: -.022em; line-height: 1.2; text-wrap: balance; }
    .message { margin: 0 0 1.5rem; max-width: 46ch; color: var(--ink-2); }
    .joke { margin: 0 0 2rem; max-width: 46ch; padding: 1rem; border-left: 3px solid var(--line-2); border-radius: 0 8px 8px 0; background: var(--paper-2); color: var(--ink-2); font-size: .9375rem; font-style: italic; }
    .btn { display: inline-block; padding: .7em 1.25em; border: 1px solid #e08600; border-radius: 5px; background: var(--aws-orange); color: var(--navy); font-weight: 650; line-height: 1.25; text-decoration: none; }
    .btn:hover { background: #ffad33; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (min-width: 48em) { .strip { height: 64px; } main { padding-block: 4rem 5rem; } }
    @media (min-width: 64em) { .container { padding-inline: 2rem; } }
  </style>
</head>
<body>
  <header class="strip">
    <div class="container"><div class="cloud-icon">&#9729;</div></div>
  </header>
  <main class="container" id="main">
    <div class="block">
      <div class="error-code">404</div>
      <h1>This resource has been terminated</h1>
      <p class="message">Looks like this page didn't survive the last cost optimization review.</p>
      <div class="joke">
        "I asked AWS where my page went. They said it's in a better region now."
      </div>
      <a href="index.html" class="btn">Return to Home Region</a>
    </div>
  </main>
</body>
</html>
