<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found | AWS Cloud Architect Guide</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Self-contained on purpose: this page must render with no second request.
    Same tokens as styles.css [design-system]. -->
  <style>
    :root { --paper: #faf9f6; --ink: #1a1d21; --ink-2: #4a5159; --line: #e6e2da;
      --navy: #15202b; --accent: #c2410c; --aws-orange: #ff9900; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; background: var(--paper); color: var(--ink);
      font: 1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
    .container { max-width: 34rem; }
    .cloud-icon { font-size: 1.75rem; line-height: 1; color: var(--aws-orange); }
    .error-code { margin: .5rem 0 1rem; color: var(--navy); font-size: 4rem; font-weight: 750;
      letter-spacing: -.04em; line-height: 1; }
    h1 { margin: 0 0 1rem; font-size: 1.75rem; font-weight: 720; letter-spacing: -.02em; line-height: 1.2; }
    .message { margin: 0 0 1.5rem; color: var(--ink-2); }
    .joke { margin: 0 0 2rem; padding: 1rem 1.25rem; border: 1px solid var(--line);
      border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: #fff;
      color: var(--ink-2); font-style: italic; }
    .btn { display: inline-block; padding: .7em 1.25em; border: 1px solid #e08600; border-radius: 5px;
      background: var(--aws-orange); color: var(--navy); font-weight: 650; text-decoration: none; }
    .btn:hover { background: #ffad33; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="container" id="main">
    <div class="cloud-icon">&#9729;</div>
    <div class="error-code">404</div>
    <h1>This resource has been terminated</h1>
    <p class="message">Looks like this page didn't survive the last cost optimization review.</p>
    <div class="joke">
      "I asked AWS where my page went. They said it's in a better region now."
    </div>
    <a href="index.html" class="btn">Return to Home Region</a>
  </main>
</body>
</html>
