<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found | AWS Cloud Architect Guide</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Self-contained on purpose: this page must render with no second request.
    Same tokens as styles.css [design-system]. -->
  <style>
    :root { --paper: #faf9f6; --paper-2: #f4f2ec; --ink: #1a1d21; --ink-2: #4a5159;
      --ink-3: #596169; --line: #e6e2da; --line-2: #d8d2c6;
      --navy: #15202b; --accent: #c2410c; --aws-orange: #ff9900; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
      padding: 3rem 1.5rem; background: var(--paper); color: var(--ink);
      font: 1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
    .container { width: 100%; max-width: 36rem; margin-inline: auto; }
    .cloud-icon { font-size: 1.5rem; line-height: 1; color: var(--aws-orange); }
    /* big but quiet: grey at 6:1, so it anchors the page without shouting */
    .error-code { margin: .25rem 0 .75rem; color: var(--ink-3); font-size: clamp(4.5rem, 19vw, 7rem);
      font-weight: 720; letter-spacing: -.05em; line-height: .95; font-variant-numeric: tabular-nums; }
    h1 { margin: 0 0 1rem; max-width: 26ch; font-size: clamp(1.6rem, 6.4vw, 2.125rem);
      font-weight: 720; letter-spacing: -.022em; line-height: 1.2; text-wrap: balance; }
    .message { margin: 0 0 1.5rem; max-width: 46ch; color: var(--ink-2); }
    /* same quiet-note language as .prose > .note in styles.css */
    .joke { margin: 0 0 2rem; padding: .75rem 1rem; border-left: 2px solid var(--line-2);
      background: var(--paper-2); color: var(--ink-2); font-size: .9375rem; font-style: italic; }
    .btn { display: inline-block; padding: .7em 1.25em; border: 1px solid #e08600; border-radius: 5px;
      background: var(--aws-orange); color: var(--navy); font-weight: 650; line-height: 1.25;
      letter-spacing: -.005em; text-decoration: none; }
    .btn:hover { background: #ffad33; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (min-width: 48em) { .error-code { margin-bottom: 1rem; } }
  </style>
</head>
<body>
  <main class="container" id="main">
    <div class="cloud-icon">&#9729;</div>
    <div class="error-code">404</div>
    <h1>This resource has been terminated</h1>
    <p class="message">Looks like this page didn't survive the last cost optimization review.</p>
    <div class="joke">
      "I asked AWS where my page went. They said it's in a better region now."
    </div>
    <a href="index.html" class="btn">Return to Home Region</a>
  </main>
</body>
</html>
